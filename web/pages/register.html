<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — SALATIFY</title>
<link rel="stylesheet" href="../static/css/style.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#123F32">
</head>
<body>
<header>
  <nav class="navbar">
    <a href="/web/index.html" class="brand"><div class="mark">S</div> SALATIFY</a>
    <div class="nav-links"><a href="/web/index.html">Beranda</a></div>
    <div class="nav-actions"><a href="/web/login.html" class="btn btn-sm btn-outline">Masuk</a></div>
  </nav>
</header>

<div class="page">
  <div class="form-card card">
    <div style="text-align:center;margin-bottom:24px">
      <div class="brand" style="font-size:1.2rem"><div class="mark" style="width:24px;height:24px;font-size:0.9rem">S</div> SALATIFY</div>
      <h2 style="font-size:1.5rem;font-weight:800;color:var(--primary);margin:10px 0 4px">Daftar</h2>
      <p style="color:var(--text-muted);font-size:0.9">Buat akun SALATIFY Anda</p>
    </div>

    <form id="form-register" novalidate>
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Masukkan username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="contoh@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Minimal 6 karakter" required autocomplete="new-password">
        <div class="input-hint">Password akan di-hash, tidak disimpan sebagai teks biasa.</div>
      </div>
      <div class="form-group">
        <label>Konfirmasi Password</label>
        <input type="password" name="password2" placeholder="Ketik ulang password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100;margin-top:8px">Daftar</button>
    </form>

    <p style="text-align:center;margin-top:18px;font-size:0.9;color:var(--text-muted)">
      Sudah punya akun? <a href="/web/login.html" style="color:var(--primary);font-weight:700">Masuk di sini</a>
    </p>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <div class="footer-brand">SALATIFY</div>
    <div class="footer-dev">Smart Islamic Companion · Hasan, Luqman, Riza, dan Wisnu</div>
  </div>
</footer>

<div id="salatify-toast" class="toast"></div>
<script type="module">
  import { api } from './static/js/api.js';
  import { toast } from './static/js/app.js';
  const form = document.getElementById('form-register');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    const d = Object.fromEntries(fd);
    if(d.password !== d.password2){ return toast('Konfirmasi password tidak cocok.', 'error'); }
    try{
      await api('/auth/register', { method:'POST', body: d, auth:false });
      toast('Registrasi berhasil. Silakan masuk.');
      setTimeout(()=>{ window.location.href = '/web/login.html'; }, 800);
    }catch(err){ toast(err.message, 'error'); }
  });
</script>
</body>
</html>
