<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al-Qur\'an — SALATIFY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;600;700&family=Fraunces:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/css/style.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#123F32">
</head>
<body>
<header>
  <nav class="navbar">
    <a href="/web/dashboard.html" class="brand"><div class="mark">S</div> SALATIFY</a>
    <div class="nav-links"><a href="/web/dashboard.html">Beranda</a><a href="/web/quran.html" class="active">Al-Qur'an</a></div>
    <div class="nav-actions">
      <button class="btn btn-icon" id="btn-logout" title="Keluar">🚪</button>
    </div>
  </nav>
</header>

<div class="page">
  <div style="max-width:640px;margin:0 auto">
    <h2 style="font-size:1.5rem;font-weight:800;color:var(--primary);margin-bottom:6px">Al-Qur'an</h2>
    <p class="section-sub" style="margin-bottom:16px">Daftar surah dan pemutar audio murottal.</p>
    <div class="form-group" style="margin-bottom:16px">
      <input type="text" id="cari" placeholder="Cari surah..." style="padding:10px 14px;border-radius:10px;border:1px solid rgba(18,63,50,0.16);background:var(--surface);color:var(--text);width:100;font:inherit;font-size:0.95rem">
    </div>
    <div id="daftar-surah">
      <!-- diisi JS -->
    </div>
    <div id="audio-box" class="card" style="margin-top:20px;display:none">
      <h3 style="font-size:1rem;font-weight:800;color:var(--primary);margin-bottom:8px">Pemutar Audio</h3>
      <div id="audio-judul" style="font-weight:700;margin-bottom:8px"></div>
      <audio id="audio" controls style="width:100;margin-bottom:8px"></audio>
      <div style="font-size:0.82rem;color:var(--text-muted)">Sumber audio murottal eksternal. Pastikan koneksi internet aktif.</div>
    </div>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <div class="footer-brand">SALATIFY</div>
    <div class="footer-dev">Smart Islamic Companion · Hasan, Luqman, Riza, dan Wisnu</div>
  </div>
</footer>

<div id="salatify-toast" class="toast"></div>
<script type="module">
  import { quran } from '/static/js/api.js?v=4';
  import { toast, setupNavbar, setupAuthLinks, escapeHtml } from '/static/js/app.js';
  setupNavbar(); setupAuthLinks();

  const elDaftar = document.getElementById('daftar-surah');
  const elCari = document.getElementById('cari');
  const elBox = document.getElementById('audio-box');
  const elJudul = document.getElementById('audio-judul');
  const elAudio = document.getElementById('audio');

  async function load(q){
    try{
      const list = await quran.list(q ? { q } : {});
      if(!list.length){
        elDaftar.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:24px">Surah tidak ditemukan.</p>';
        return;
      }
      elDaftar.innerHTML = list.map(s=>
        `<div class="surah-item btn" style="color:inherit" onclick="pilih(${s.id}, '${escapeHtml(s.nama_latin)}', '${escapeHtml(s.nama_arab)}')">
          <div class="no">${s.nomor}</div>
          <div style="flex:1">
            <div class="name">${escapeHtml(s.nama_latin)}</div>
            <div class="meta">${escapeHtml(s.nama_arab)} • ${s.jumlah_ayat||'-'} ayat • ${s.jenis||'-'}</div>
          </div>
          <div class="play">${s.is_favorit?'★':'▶'}</div>
        </div>`
      ).join('');
    }catch(err){ toast('Gagal memuat surah: '+err.message,'error'); }
  }
  load();
  elCari.addEventListener('input', (e)=> load(e.target.value));

  window.pilih = (id, latin, arab)=>{
    elJudul.textContent = latin + ' — ' + arab;
    elBox.style.display = 'block';
    // Audio murottal (contoh sumber eksternal legal; ganti URL asli jika tersedia)
    const url = `https://cdn.jsdelivr.net/aria/mp3/${String(id).padStart(3,'0')}.mp3`;
    elAudio.src = url;
    elAudio.load();
    elAudio.play().catch(()=>{
      toast('Audio tidak dapat diputar. Sumber audio belum tersedia di sini.');
    });
  };
</script>
</body>
</html>
